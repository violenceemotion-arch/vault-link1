<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link Vault - Pro (Secured)</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --primary: #10b981; 
            --primary-hover: #059669;
            --danger: #ef4444;
            --badge-bg: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
        }

        .vault-container {
            background-color: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 550px;
        }

        /* Tampilan khusus box login */
        #loginBox {
            display: flex; /* Akan diatur via JS nanti */
            flex-direction: column;
            text-align: center;
            gap: 1rem;
        }
        
        #mainVault {
            display: none; /* Disembunyikan sebelum login */
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 1rem;
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary);
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #94a3b8;
        }

        .logout-btn {
            position: absolute;
            top: 0;
            right: 0;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .logout-btn:hover {
            background: var(--danger);
            color: white;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .full-width {
            grid-column: span 2;
        }

        input, select {
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: var(--text-color);
            font-size: 0.95rem;
            outline: none;
            width: 100%;
            box-sizing: border-box;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s ease;
            width: 100%;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .search-bar {
            margin-bottom: 1.5rem;
            background-color: #1e293b;
            border: 1px dashed #475569;
        }

        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: 300px;
            overflow-y: auto;
        }

        /* Kustomisasi scrollbar */
        .link-list::-webkit-scrollbar {
            width: 6px;
        }
        .link-list::-webkit-scrollbar-thumb {
            background-color: #475569;
            border-radius: 4px;
        }

        .link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #334155;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid var(--primary);
        }

        .link-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            gap: 4px;
        }

        .link-title {
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .category-badge {
            font-size: 0.7rem;
            background-color: var(--badge-bg);
            padding: 2px 8px;
            border-radius: 12px;
            color: #cbd5e1;
            border: 1px solid #475569;
        }

        .link-url {
            color: #94a3b8;
            font-size: 0.85rem;
            text-decoration: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-url:hover {
            color: var(--primary);
            text-decoration: underline;
        }

        .delete-btn {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .delete-btn:hover {
            background-color: var(--danger);
            color: white;
        }

        #loginError {
            color: var(--danger);
            font-size: 0.85rem;
            display: none;
        }
    </style>
</head>
<body>

    <!-- BOX LOGIN -->
    <div class="vault-container" id="loginBox">
        <div class="header" style="border:none; margin-bottom: 0;">
            <h1>Vault Security</h1>
            <p>Masukkan password untuk mengakses link</p>
        </div>
        <input type="password" id="passwordInput" placeholder="Password (default: dani123)" onkeypress="handleEnter(event)">
        <p id="loginError">Password salah, bro!</p>
        <button class="btn-primary" onclick="checkLogin()">Masuk</button>
    </div>

    <!-- BOX VAULT UTAMA -->
    <div class="vault-container" id="mainVault">
        <div class="header">
            <h1>Link Vault</h1>
            <p>Dani Jayanto — Kelas XI E</p>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="input-group">
            <input type="text" id="linkTitle" class="full-width" placeholder="Nama Link (Contoh: Web Fansub Tokusatsu)">
            <input type="url" id="linkUrl" placeholder="https://...">
            <select id="linkCategory">
                <option value="Tugas">Tugas Sekolah</option>
                <option value="Referensi">Referensi / Tools</option>
                <option value="Hiburan">Hiburan / Hobi</option>
            </select>
            <button class="btn-primary full-width" onclick="addLink()">Simpan ke Vault</button>
        </div>

        <input type="text" id="searchInput" class="search-bar" placeholder="Cari link yang sudah disimpan..." onkeyup="searchLinks()">

        <ul class="link-list" id="linkList">
            <!-- Link akan muncul di sini -->
        </ul>
    </div>

    <script>
        // --- SISTEM LOGIN ---
        const PASSWORD_BENAR = "dani123"; // Ganti password lu di sini

        document.addEventListener('DOMContentLoaded', checkSession);

        function checkSession() {
            const isLoggedIn = sessionStorage.getItem('vaultLoggedIn');
            if (isLoggedIn === 'true') {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('mainVault').style.display = 'block';
                loadLinks(); // Load data cuma kalau udah login
            } else {
                document.getElementById('loginBox').style.display = 'flex';
                document.getElementById('mainVault').style.display = 'none';
            }
        }

        function checkLogin() {
            const passInput = document.getElementById('passwordInput').value;
            if (passInput === PASSWORD_BENAR) {
                sessionStorage.setItem('vaultLoggedIn', 'true');
                document.getElementById('passwordInput').value = '';
                document.getElementById('loginError').style.display = 'none';
                checkSession();
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function handleEnter(event) {
            if (event.key === "Enter") {
                checkLogin();
            }
        }

        function logout() {
            sessionStorage.removeItem('vaultLoggedIn');
            checkSession();
        }

        // --- SISTEM VAULT UTAMA ---
        function addLink() {
            const titleInput = document.getElementById('linkTitle');
            const urlInput = document.getElementById('linkUrl');
            const categoryInput = document.getElementById('linkCategory');
            
            const title = titleInput.value.trim();
            let url = urlInput.value.trim();
            const category = categoryInput.value;

            if (!title || !url) {
                alert("Nama dan URL harus diisi, bro!");
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'https://' + url;
            }

            const linkData = {
                id: Date.now().toString(),
                title: title,
                url: url,
                category: category
            };

            const links = getLinks();
            links.unshift(linkData); // unshift biar link baru muncul paling atas
            saveLinks(links);

            titleInput.value = '';
            urlInput.value = '';
            document.getElementById('searchInput').value = '';
            
            renderLinks(links);
        }

        function deleteLink(id) {
            let links = getLinks();
            links = links.filter(link => link.id !== id);
            saveLinks(links);
            searchLinks(); 
        }

        function getLinks() {
            const linksJSON = localStorage.getItem('vaultLinksPro');
            return linksJSON ? JSON.parse(linksJSON) : [];
        }

        function saveLinks(links) {
            localStorage.setItem('vaultLinksPro', JSON.stringify(links));
        }

        function loadLinks() {
            renderLinks(getLinks());
        }

        function searchLinks() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const links = getLinks();
            
            const filteredLinks = links.filter(link => 
                link.title.toLowerCase().includes(keyword) || 
                link.category.toLowerCase().includes(keyword)
            );
            
            renderLinks(filteredLinks);
        }

        function renderLinks(linksToRender) {
            const linkList = document.getElementById('linkList');
            linkList.innerHTML = '';

            if (linksToRender.length === 0) {
                linkList.innerHTML = '<li style="text-align:center; color:#94a3b8; font-size:0.9rem;">Belum ada link yang disimpan.</li>';
                return;
            }

            linksToRender.forEach(link => {
                const li = document.createElement('li');
                li.className = 'link-item';

                li.innerHTML = `
                    <div class="link-info">
                        <span class="link-title">
                            ${link.title} 
                            <span class="category-badge">${link.category}</span>
                        </span>
                        <a href="${link.url}" class="link-url" target="_blank" rel="noopener noreferrer">${link.url}</a>
                    </div>
                    <button class="delete-btn" onclick="deleteLink('${link.id}')">Hapus</button>
                `;
                
                linkList.appendChild(li);
            });
        }
    </script>
</body>
</html>
